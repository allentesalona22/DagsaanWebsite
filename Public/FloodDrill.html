<!-- message function -->
<script>
    const emergencyButtons = document.querySelectorAll(".emergencyBtn");
    const textarea = document.querySelector("#msg");

    emergencyButtons.forEach(function (button) {
        button.addEventListener("click", function () {
            let placeholder = "___(editable)";
            let message = "";

            if (button.textContent === "DRILL") {
                const location = "___(editable)";
                placeholder = `___(editable)`;
                message = `A flood drill is initiated on ${location}. This flood drill will be located at ${placeholder}. Please kindly participate, thank you. Ingat, Bacooreños.`;
            } else if (button.textContent === "BAHA") {
                const alertLocation = "___(editable)";
                message = `Be alert at ${alertLocation}. There is a chance of flooding at your location. Save your batteries in case of blackout, take relocation center as early as possible, and ready your GO Emergency pack. The disaster risk reduction agencies are on patrol in case of flood rush. Ingat, Bacooreños.`;
            } else if (button.textContent === "Announcement") {
                const typhoonName = "___(editable)";
                message = `Bagyong ${typhoonName} is near the Philippine Area of Responsibility. Be prepared for strong winds and rain. Emergency hotlines can be seen at your application. Ingat, Bacooreños.`;
            }

            message = message.replace(/___\(editable\)/g, placeholder);
            textarea.value = message;
        });
    });
</script>
